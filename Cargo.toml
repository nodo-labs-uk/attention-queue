[package]
name = "aq"
version = "0.1.1"
description = "An attention queue for Claude Code sessions in tmux: review, step, quiz or vibe"
license = "MIT"
repository = "https://github.com/nodo-labs-uk/attention-queue"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2.7.0"
tempfile = "3.27.0"
syntect = "5.3.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
unicode-properties = "0.1.5"

[dev-dependencies]
insta = "1.49.0"

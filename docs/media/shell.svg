<defs><g id="r0"><rect x="0.0" width="33.7" height="18" fill="#81a2be"/><rect x="33.7" width="8.4" height="18" fill="#21252b"/><rect x="42.1" width="92.7" height="18" fill="#3e4451"/><rect x="134.9" width="615.4" height="18" fill="#21252b"/><rect x="750.3" width="109.6" height="18" fill="#3e4451"/><rect x="859.9" width="143.3" height="18" fill="#21252b"/><text x="8.4" y="14" fill="#282c34" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">aq</text><text x="50.6" y="14" fill="#81a2be" font-weight="bold" textLength="75.9" lengthAdjust="spacingAndGlyphs">YOUR MOVE</text><text x="143.3" y="14" fill="#ffffff" font-weight="bold" textLength="25.3" lengthAdjust="spacingAndGlyphs">api</text><text x="177.0" y="14" fill="#969896" textLength="101.2" lengthAdjust="spacingAndGlyphs">· window api</text><text x="758.7" y="14" fill="#f0c674" font-weight="bold">1</text><text x="775.6" y="14" fill="#ffffff" textLength="75.9" lengthAdjust="spacingAndGlyphs">your move</text><text x="868.3" y="14" fill="#8abeb7" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">F3</text><text x="893.6" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">keys</text><text x="944.2" y="14" fill="#8abeb7" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">F1</text><text x="969.4" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">help</text></g><g id="r1"></g><g id="r2"><text x="92.7" y="14" fill="#81a2be" font-weight="bold" textLength="261.3" lengthAdjust="spacingAndGlyphs">Your move: it finished its turn</text></g><g id="r3"><text x="92.7" y="14" fill="#ffffff" font-weight="bold" textLength="25.3" lengthAdjust="spacingAndGlyphs">api</text><text x="134.9" y="14" fill="#969896" textLength="84.3" lengthAdjust="spacingAndGlyphs">window api</text></g><g id="r4"><text x="92.7" y="14" fill="#ffffff" textLength="590.1" lengthAdjust="spacingAndGlyphs">The config on the server is updated, but the running service still has</text></g><g id="r5"><text x="92.7" y="14" fill="#ffffff" textLength="590.1" lengthAdjust="spacingAndGlyphs">the old limits. Restarting it needs sudo, which I can't run from here.</text></g><g id="r6"><text x="92.7" y="14" fill="#ffffff" textLength="151.7" lengthAdjust="spacingAndGlyphs">Run this yourself:</text></g><g id="r7"><text x="92.7" y="14" fill="#ffffff" textLength="236.0" lengthAdjust="spacingAndGlyphs">! sudo systemctl restart api</text></g><g id="r8"><text x="92.7" y="14" fill="#ffffff" textLength="472.1" lengthAdjust="spacingAndGlyphs">Then I'll make a few test calls to check the new limits.</text></g><g id="r9"><rect x="92.7" width="25.3" height="18" fill="#3e4451"/><rect x="202.3" width="25.3" height="18" fill="#3e4451"/><rect x="286.6" width="59.0" height="18" fill="#3e4451"/><rect x="413.1" width="25.3" height="18" fill="#3e4451"/><rect x="505.8" width="25.3" height="18" fill="#3e4451"/><rect x="598.5" width="25.3" height="18" fill="#3e4451"/><rect x="725.0" width="25.3" height="18" fill="#3e4451"/><rect x="809.3" width="25.3" height="18" fill="#3e4451"/><text x="101.2" y="14" fill="#8abeb7" font-weight="bold">a</text><text x="126.4" y="14" fill="#969896" textLength="59.0" lengthAdjust="spacingAndGlyphs">approve</text><text x="210.8" y="14" fill="#8abeb7" font-weight="bold">d</text><text x="236.0" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">done</text><text x="295.1" y="14" fill="#8abeb7" font-weight="bold" textLength="42.1" lengthAdjust="spacingAndGlyphs">Enter</text><text x="354.1" y="14" fill="#969896" textLength="42.1" lengthAdjust="spacingAndGlyphs">reply</text><text x="421.5" y="14" fill="#8abeb7" font-weight="bold">T</text><text x="446.8" y="14" fill="#969896" textLength="42.1" lengthAdjust="spacingAndGlyphs">TL;DR</text><text x="514.2" y="14" fill="#8abeb7" font-weight="bold">x</text><text x="539.5" y="14" fill="#969896" textLength="42.1" lengthAdjust="spacingAndGlyphs">stash</text><text x="607.0" y="14" fill="#8abeb7" font-weight="bold">r</text><text x="632.2" y="14" fill="#969896" textLength="75.9" lengthAdjust="spacingAndGlyphs">read fast</text><text x="733.4" y="14" fill="#8abeb7" font-weight="bold">c</text><text x="758.7" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">copy</text><text x="817.7" y="14" fill="#8abeb7" font-weight="bold">g</text><text x="843.0" y="14" fill="#969896" textLength="75.9" lengthAdjust="spacingAndGlyphs">go to win</text></g><g id="r10"><rect x="0.0" width="33.7" height="18" fill="#81a2be"/><rect x="33.7" width="8.4" height="18" fill="#21252b"/><rect x="42.1" width="92.7" height="18" fill="#3e4451"/><rect x="134.9" width="615.4" height="18" fill="#21252b"/><rect x="750.3" width="109.6" height="18" fill="#3e4451"/><rect x="859.9" width="143.3" height="18" fill="#21252b"/><text x="8.4" y="14" fill="#282c34" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">aq</text><text x="50.6" y="14" fill="#81a2be" font-weight="bold" textLength="75.9" lengthAdjust="spacingAndGlyphs">YOUR MOVE</text><text x="143.3" y="14" fill="#ffffff" font-weight="bold" textLength="25.3" lengthAdjust="spacingAndGlyphs">api</text><text x="177.0" y="14" fill="#969896" textLength="101.2" lengthAdjust="spacingAndGlyphs">· window api</text><text x="758.7" y="14" fill="#f0c674" font-weight="bold">1</text><text x="775.6" y="14" fill="#ffffff" textLength="75.9" lengthAdjust="spacingAndGlyphs">your move</text><text x="868.3" y="14" fill="#8abeb7" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">F3</text><text x="893.6" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">keys</text><text x="944.2" y="14" fill="#8abeb7" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">F1</text><text x="969.4" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">help</text></g><g id="r11"></g><g id="r12"><text x="50.6" y="14" fill="#ffffff" textLength="910.4" lengthAdjust="spacingAndGlyphs">┌ shell in api · exit or Ctrl-D closes it · Claude's last command is typed in, Enter runs it ──────────────┐</text></g><g id="r13"><text x="50.6" y="14" fill="#ffffff">│</text><text x="59.0" y="14" fill="#2472c8" textLength="42.1" lengthAdjust="spacingAndGlyphs">~/api</text><text x="109.6" y="14" fill="#ffffff" textLength="851.4" lengthAdjust="spacingAndGlyphs">❯ sudo systemctl restart api                                                                        │</text></g><g id="r14"><text x="50.6" y="14" fill="#ffffff" textLength="910.4" lengthAdjust="spacingAndGlyphs">│                                                                                                          │</text></g><g id="r15"><text x="50.6" y="14" fill="#ffffff" textLength="910.4" lengthAdjust="spacingAndGlyphs">└──────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text></g><g id="r16"><rect x="92.7" width="25.3" height="18" fill="#3e4451"/><rect x="202.3" width="25.3" height="18" fill="#3e4451"/><rect x="286.6" width="59.0" height="18" fill="#3e4451"/><rect x="413.1" width="25.3" height="18" fill="#3e4451"/><rect x="505.8" width="25.3" height="18" fill="#3e4451"/><rect x="598.5" width="25.3" height="18" fill="#3e4451"/><rect x="725.0" width="25.3" height="18" fill="#3e4451"/><rect x="809.3" width="25.3" height="18" fill="#3e4451"/><text x="101.2" y="14" fill="#8abeb7" font-weight="bold">a</text><text x="126.4" y="14" fill="#969896" textLength="59.0" lengthAdjust="spacingAndGlyphs">approve</text><text x="210.8" y="14" fill="#8abeb7" font-weight="bold">d</text><text x="236.0" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">done</text><text x="295.1" y="14" fill="#8abeb7" font-weight="bold" textLength="42.1" lengthAdjust="spacingAndGlyphs">Enter</text><text x="354.1" y="14" fill="#969896" textLength="42.1" lengthAdjust="spacingAndGlyphs">reply</text><text x="421.5" y="14" fill="#8abeb7" font-weight="bold">T</text><text x="446.8" y="14" fill="#969896" textLength="42.1" lengthAdjust="spacingAndGlyphs">TL;DR</text><text x="514.2" y="14" fill="#8abeb7" font-weight="bold">x</text><text x="539.5" y="14" fill="#969896" textLength="42.1" lengthAdjust="spacingAndGlyphs">stash</text><text x="607.0" y="14" fill="#8abeb7" font-weight="bold">r</text><text x="632.2" y="14" fill="#969896" textLength="75.9" lengthAdjust="spacingAndGlyphs">read fast</text><text x="733.4" y="14" fill="#8abeb7" font-weight="bold">c</text><text x="758.7" y="14" fill="#969896" textLength="33.7" lengthAdjust="spacingAndGlyphs">copy</text><text x="817.7" y="14" fill="#8abeb7" font-weight="bold">g</text><text x="843.0" y="14" fill="#969896" textLength="75.9" lengthAdjust="spacingAndGlyphs">go to win</text></g></defs>

<defs><g id="r0"><rect x="0.0" width="33.7" height="18" fill="#61afef"/><rect x="33.7" width="969.4" height="18" fill="#21252b"/><text x="8.4" y="14" fill="#282c34" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">aq</text><text x="42.1" y="14" fill="#9099a6" textLength="126.4" lengthAdjust="spacingAndGlyphs">nothing waiting</text><text x="944.2" y="14" fill="#56b6c2" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">F1</text><text x="969.4" y="14" fill="#9099a6" textLength="33.7" lengthAdjust="spacingAndGlyphs">help</text></g><g id="r1"></g><g id="r2"><rect x="8.4" width="75.9" height="18" fill="#61afef"/><text x="16.9" y="14" fill="#282c34" font-weight="bold" textLength="59.0" lengthAdjust="spacingAndGlyphs">● 0 api</text></g><g id="r3"><text x="0.0" y="14" fill="#ffffff" textLength="362.5" lengthAdjust="spacingAndGlyphs">❯ put the new limits live on the server too</text></g><g id="r4"><text x="0.0" y="14" fill="#ffffff" textLength="607.0" lengthAdjust="spacingAndGlyphs">● The config on the server is updated, but the running service still has</text></g><g id="r5"><text x="16.9" y="14" fill="#ffffff" textLength="590.1" lengthAdjust="spacingAndGlyphs">the old limits. Restarting it needs sudo, which I can't run from here.</text></g><g id="r6"><text x="16.9" y="14" fill="#ffffff" textLength="151.7" lengthAdjust="spacingAndGlyphs">Run this yourself:</text></g><g id="r7"><text x="16.9" y="14" fill="#ffffff" textLength="236.0" lengthAdjust="spacingAndGlyphs">! sudo systemctl restart api</text></g><g id="r8"><text x="16.9" y="14" fill="#ffffff" textLength="472.1" lengthAdjust="spacingAndGlyphs">Then I'll make a few test calls to check the new limits.</text></g><g id="r9"><rect x="0.0" width="944.2" height="18" fill="#21252b"/><text x="8.4" y="14" fill="#56b6c2" font-weight="bold" textLength="25.3" lengthAdjust="spacingAndGlyphs">h/l</text><text x="42.1" y="14" fill="#9099a6" textLength="33.7" lengthAdjust="spacingAndGlyphs">pick</text><text x="101.2" y="14" fill="#56b6c2" font-weight="bold" textLength="42.1" lengthAdjust="spacingAndGlyphs">Enter</text><text x="151.7" y="14" fill="#9099a6" textLength="59.0" lengthAdjust="spacingAndGlyphs">message</text><text x="236.0" y="14" fill="#56b6c2" font-weight="bold">g</text><text x="252.9" y="14" fill="#9099a6" textLength="101.2" lengthAdjust="spacingAndGlyphs">go to window</text><text x="379.3" y="14" fill="#56b6c2" font-weight="bold">p</text><text x="396.2" y="14" fill="#9099a6" textLength="59.0" lengthAdjust="spacingAndGlyphs">open PR</text><text x="480.5" y="14" fill="#56b6c2" font-weight="bold">x</text><text x="497.4" y="14" fill="#9099a6" textLength="42.1" lengthAdjust="spacingAndGlyphs">close</text><text x="564.8" y="14" fill="#56b6c2" font-weight="bold">M</text><text x="581.7" y="14" fill="#9099a6" textLength="33.7" lengthAdjust="spacingAndGlyphs">mode</text><text x="640.7" y="14" fill="#56b6c2" font-weight="bold">W</text><text x="657.5" y="14" fill="#9099a6" textLength="101.2" lengthAdjust="spacingAndGlyphs">where are we</text><text x="784.0" y="14" fill="#56b6c2" font-weight="bold">t</text><text x="800.9" y="14" fill="#9099a6" textLength="42.1" lengthAdjust="spacingAndGlyphs">theme</text><text x="868.3" y="14" fill="#56b6c2" font-weight="bold">Q</text><text x="885.1" y="14" fill="#9099a6" textLength="33.7" lengthAdjust="spacingAndGlyphs">quit</text></g><g id="r10"><rect x="0.0" width="33.7" height="18" fill="#61afef"/><rect x="33.7" width="969.4" height="18" fill="#21252b"/><text x="8.4" y="14" fill="#282c34" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">aq</text><text x="42.1" y="14" fill="#9099a6" textLength="126.4" lengthAdjust="spacingAndGlyphs">nothing waiting</text><text x="944.2" y="14" fill="#56b6c2" font-weight="bold" textLength="16.9" lengthAdjust="spacingAndGlyphs">F1</text><text x="969.4" y="14" fill="#9099a6" textLength="33.7" lengthAdjust="spacingAndGlyphs">help</text></g><g id="r11"></g><g id="r12"><rect x="8.4" width="42.1" height="18" fill="#61afef"/><text x="16.9" y="14" fill="#282c34" font-weight="bold" textLength="25.3" lengthAdjust="spacingAndGlyphs">● 0</text><text x="50.6" y="14" fill="#ffffff" textLength="910.4" lengthAdjust="spacingAndGlyphs">┌ shell in api · exit or Ctrl-D closes it · Claude's last ! command is typed in, Enter runs it ────────────┐</text></g><g id="r13"><text x="50.6" y="14" fill="#ffffff">│</text><text x="59.0" y="14" fill="#2472c8" textLength="42.1" lengthAdjust="spacingAndGlyphs">~/api</text><text x="109.6" y="14" fill="#ffffff" textLength="851.4" lengthAdjust="spacingAndGlyphs">❯ sudo systemctl restart api                                                                        │</text></g><g id="r14"><text x="0.0" y="14" fill="#ffffff" textLength="961.0" lengthAdjust="spacingAndGlyphs">❯ put │                                                                                                          │</text></g><g id="r15"><text x="50.6" y="14" fill="#ffffff" textLength="910.4" lengthAdjust="spacingAndGlyphs">│                                                                                                          │</text></g><g id="r16"><text x="0.0" y="14" fill="#ffffff" textLength="961.0" lengthAdjust="spacingAndGlyphs">● The │                                                                                                          │</text></g><g id="r17"><text x="16.9" y="14" fill="#ffffff" textLength="944.2" lengthAdjust="spacingAndGlyphs">the │                                                                                                          │</text></g><g id="r18"><text x="16.9" y="14" fill="#ffffff" textLength="944.2" lengthAdjust="spacingAndGlyphs">Run │                                                                                                          │</text></g><g id="r19"><text x="16.9" y="14" fill="#ffffff" textLength="944.2" lengthAdjust="spacingAndGlyphs">! su│                                                                                                          │</text></g><g id="r20"><text x="16.9" y="14" fill="#ffffff" textLength="944.2" lengthAdjust="spacingAndGlyphs">Then│                                                                                                          │</text></g><g id="r21"><text x="50.6" y="14" fill="#ffffff" textLength="910.4" lengthAdjust="spacingAndGlyphs">└──────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text></g><g id="r22"><rect x="0.0" width="944.2" height="18" fill="#21252b"/><text x="8.4" y="14" fill="#56b6c2" font-weight="bold" textLength="25.3" lengthAdjust="spacingAndGlyphs">h/l</text><text x="42.1" y="14" fill="#9099a6" textLength="33.7" lengthAdjust="spacingAndGlyphs">pick</text><text x="101.2" y="14" fill="#56b6c2" font-weight="bold" textLength="42.1" lengthAdjust="spacingAndGlyphs">Enter</text><text x="151.7" y="14" fill="#9099a6" textLength="59.0" lengthAdjust="spacingAndGlyphs">message</text><text x="236.0" y="14" fill="#56b6c2" font-weight="bold">g</text><text x="252.9" y="14" fill="#9099a6" textLength="101.2" lengthAdjust="spacingAndGlyphs">go to window</text><text x="379.3" y="14" fill="#56b6c2" font-weight="bold">p</text><text x="396.2" y="14" fill="#9099a6" textLength="59.0" lengthAdjust="spacingAndGlyphs">open PR</text><text x="480.5" y="14" fill="#56b6c2" font-weight="bold">x</text><text x="497.4" y="14" fill="#9099a6" textLength="42.1" lengthAdjust="spacingAndGlyphs">close</text><text x="564.8" y="14" fill="#56b6c2" font-weight="bold">M</text><text x="581.7" y="14" fill="#9099a6" textLength="33.7" lengthAdjust="spacingAndGlyphs">mode</text><text x="640.7" y="14" fill="#56b6c2" font-weight="bold">W</text><text x="657.5" y="14" fill="#9099a6" textLength="101.2" lengthAdjust="spacingAndGlyphs">where are we</text><text x="784.0" y="14" fill="#56b6c2" font-weight="bold">t</text><text x="800.9" y="14" fill="#9099a6" textLength="42.1" lengthAdjust="spacingAndGlyph